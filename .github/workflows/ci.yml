name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly live-portal smoke (job `weekly-live`): Mondays 13:00 UTC (~8am Dallas).
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  verify:
    # Local parity target: `make ci-local` (same gates; deps come from `make setup` locally).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff — errors only)
        run: ruff check --select E9,F63,F7,F82,B006,B017 .

      # FN6 coverage ratchet — ONLY-INCREASES: never lower this number; raise it as
      # coverage grows (measured baseline ~35%, gated one point above it). Local
      # mirror: `make coverage`.
      - name: Unit & regression tests (no network) + coverage ratchet
        run: pytest --cov=src --cov=server --cov-report=term-missing --cov-fail-under=36

      - name: Module self-checks
        run: python pipeline.py --checks-only

      - name: Offline fixture pipeline
        run: python pipeline.py --fixture

      - name: Workbook build smoke
        run: python build_workbook.py

      # Recalc verification runs locally via `make recalc` (needs LibreOffice).

  weekly-live:
    # RL5: weekly live-portal smoke tier (county-site markup breakage alarm).
    # Deliberately a separate job so push/PR runs are unaffected; it only fires on
    # the schedule above or a manual "Run workflow" dispatch, and never gates merges.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install chromium (Playwright)
        run: playwright install chromium --with-deps

      # The live tier lives in repo-root test_live_portals.py, but pytest.ini sets
      # `testpaths = tests`, so bare `pytest -m live` collects nothing (exit 5);
      # naming the module fixes collection and the CLI `-m live` overrides the
      # default addopts filter (`not live and not recalc`) for this opt-in job only.
      - name: Live portal smoke (Collin Clerk / DCAD / Grayson)
        env:
          # Passthrough with defaults: set repo Variables of the same names to
          # retarget the smoke checks without code edits.
          HERMES_TEST_PARTY: ${{ vars.HERMES_TEST_PARTY || 'ISLAM MAZHAR' }}
          HERMES_TEST_ADDRESS: ${{ vars.HERMES_TEST_ADDRESS || '15806 BREEDLOVE PLACE, ADDISON, TX 75001' }}
        run: pytest test_live_portals.py -m live
