name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff — errors only)
        run: ruff check --select E9,F63,F7,F82,B006,B017 --src .

      - name: Unit & regression tests (no network)
        run: pytest -m "not live and not recalc"

      - name: Module self-checks
        run: python pipeline.py --checks-only

      - name: Offline fixture pipeline
        run: python pipeline.py --fixture

      - name: Workbook build smoke
        run: python build_workbook.py

      # Recalc verification runs locally via `make recalc` (needs LibreOffice).
