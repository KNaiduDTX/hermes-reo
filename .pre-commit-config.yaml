repos:
  - repo: local
    hooks:
      - id: ruff-correctness
        name: ruff (correctness errors)
        entry: .venv/bin/ruff check --select E9,F63,F7,F82,B006,B017
        language: system
        types: [python]
        pass_filenames: true
      - id: no-utcnow
        name: no naive utcnow in src/
        entry: bash -c '! grep -rn "datetime.utcnow()" src/ || (echo "naive utcnow found" && exit 1)'
        language: system
        pass_filenames: false
        files: ^src/
  - repo: local
    hooks:
      - id: unit-tests-pre-push
        name: unit tests
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
