repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--select, "E9,F63,F7,F82,B006,B017", --src]
  - repo: local
    hooks:
      - id: no-network-tests-by-default
        name: block committing changes that break unit tests
        entry: bash -c 'cd "$PWD" && .venv/bin/python -m pytest -m "not live and not recalc" -x -q'
        language: system
        pass_filenames: false
        stages: [pre-push]
