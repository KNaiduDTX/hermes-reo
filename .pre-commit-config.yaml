repos:
  - repo: local
    hooks:
      - id: ruff-correctness
        name: ruff (correctness errors)
        entry: .venv/bin/ruff check --select E9,F63,F7,F82,B006,B017
        language: system
        types: [python]
        pass_filenames: true
      - id: no-utcnow
        name: no naive utcnow in src/
        entry: bash -c '! grep -rn "datetime.utcnow()" src/ || (echo "naive utcnow found" && exit 1)'
        language: system
        pass_filenames: false
        files: ^src/
# Audit TEST-9: the unit-tests-pre-push entry below was dead config —
# core.hooksPath=.githooks bypasses the pre-commit framework on push, and
# .githooks/pre-push already runs pytest directly. Removed to keep one
# source of truth per gate.
